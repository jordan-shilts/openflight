<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16181a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenFlight" />
    <title>OpenFlight</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('openflight.theme');
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var locale = localStorage.getItem('openflight.locale:v1');
          var langs = { en: 'en', es: 'es', fr: 'fr', pt: 'pt-BR' };
          if (langs[locale]) document.documentElement.lang = langs[locale];
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
