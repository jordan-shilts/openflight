% Club-path profile: the fast ball profile plus 14 pre-trigger frames.
% The camera trigger fires after the ball leaves and the freeze lands 2-4
% frames late, so impact sits ~10-25 ms before the trigger. Fourteen 3 ms
% pre-trigger frames (bins 20-72, 0.94-3.4 m) keep the clubhead approach to
% the tee for club path; impact and ball phases are unchanged (7 + 8 frames).
% 29 frames x 15,264 B IQ8 = ~443 KB, ~4.3 s per capture at 1,041,667 baud.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq8
iq8Scale 128
phaseCaptureCfg 20 53 14 32 53 7 47 53 47 8 1
lowPower 0 0
sensorStart
