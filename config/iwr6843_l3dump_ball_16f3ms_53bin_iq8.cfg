% Fast ball-only profile for a camera-triggered rig with no OPS243.
% 16 frames x 3 ms, 3 TX, 12 loops, moving 53-bin windows, IQ8 storage.
% The camera trigger fires a few frames after impact, so the default profile's
% nine pre-trigger frames hold no flight the ball estimators keep. This keeps
% one (the firmware minimum) plus the same seven impact and eight ball frames,
% and stores them as IQ8: 244,364 bytes. Measured on the Pi 5: 2.41 s per
% capture against 7.10 s for the default profile, with the moving-signal floor
% up 0.4 dB (148 to 156 counts) from the 8-bit samples.
% Replaying 32 full captures this way (2026-11-08 session) moved ball speed by
% 0.1 mph and the horizontal phase by under 1 degree at the median.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq8
iq8Scale 128
phaseCaptureCfg 20 53 1 32 53 7 47 53 47 8 1
lowPower 0 0
sensorStart
